name: Bitvavo fifteen-year backtest

on:
  push:
    branches:
      - analysis/bitvavo-15y-backtest-20260830
    paths:
      - tools/bitvavo_backtest_15y.py
      - .github/workflows/bitvavo-backtest-15y.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas requests

      - name: Run backtest
        id: backtest
        shell: bash
        run: |
          set +e
          python tools/bitvavo_backtest_15y.py
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit report files
        shell: bash
        run: |
          test -f reports/bitvavo-15-year-backtest/summary.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/bitvavo-15-year-backtest
          if ! git diff --cached --quiet; then
            git commit -m "Add Bitvavo 15-year backtest results [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitvavo-15-year-backtest
          path: reports/bitvavo-15-year-backtest
          if-no-files-found: error

      - name: Fail when overlap validation mismatches
        if: steps.backtest.outputs.exit_code != '0'
        run: exit 1
